
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#1E88E5">
    <meta name="description" content="A modern, offline-first productivity application built with React and Tailwind CSS.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>LanDecs - LanTask </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              surface: 'var(--surface)',
              'surface-container': 'var(--surface-container)',
              'surface-container-low': 'var(--surface-container-low)',
              'surface-container-high': 'var(--surface-container-high)',
              'surface-container-highest': 'var(--surface-container-highest)',
              'on-surface': 'var(--on-surface)',
              'on-surface-variant': 'var(--on-surface-variant)',
              primary: 'var(--primary)',
              'primary-container': 'var(--primary-container)',
              'on-primary': 'var(--on-primary)',
              'on-primary-container': 'var(--on-primary-container)',
              tertiary: 'var(--tertiary)',
              'tertiary-container': 'var(--tertiary-container)',
              'on-tertiary-container': 'var(--on-tertiary-container)',
              outline: 'var(--outline)',
              'outline-variant': 'var(--outline-variant)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Poppins', 'sans-serif'],
            },
            transitionTimingFunction: {
                'spring': 'var(--ease-spring)',
                'expo': 'var(--ease-expo)',
            },
            animation: {
              'slide-up': 'slideUp 0.8s var(--ease-spring) forwards',
              'enter': 'enter 0.6s var(--ease-spring) forwards',
              'pop': 'pop 0.4s var(--ease-spring) forwards',
              'flip-in': 'flipIn 0.8s var(--ease-spring) forwards',
              'fade-scale': 'fadeScale 0.4s ease-out forwards',
              'twinkle': 'twinkle 3s ease-in-out infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
                twinkle: {
                    '0%, 100%': { opacity: 0.2, transform: 'scale(0.8)' },
                    '50%': { opacity: 1, transform: 'scale(1.2)' },
                },
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            transition: background-color 0.5s var(--ease-spring), color 0.5s var(--ease-spring);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .grayscale-mode { filter: grayscale(100%); }
        h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Poppins', sans-serif; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            transition: font-variation-settings 0.4s var(--ease-spring);
        }
        
        button:active .material-symbols-outlined {
             font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Utilities */
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Scrollbar for Desktop */
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }
        ::-webkit-scrollbar-track {
          background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
          background: var(--outline-variant); 
          border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: var(--outline); 
        }

        /* Selection */
        ::selection {
          background: var(--primary-container);
          color: var(--on-primary-container);
        }
